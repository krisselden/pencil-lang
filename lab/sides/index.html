<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sides, measured</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  canvas { width: 100%; max-width: 320px; display: block; margin: 8px 0; background: #000; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 12px 2px 0; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<main>
  <h1 style="font-size:16px;margin:0">Both sides of every circle, in one fragment loop</h1>
  <p>How long a frame takes when each pixel adds up every circle's side. Each circle's values come from a data texture. 1080 × 1080, and each row is the median of 30 frames, waiting for the GPU each time.</p>
  <button id="go" type="button">Measure</button>
  <table><thead><tr><th>Backend</th><th>Circles</th><th>Median ms</th><th>Worst ms</th></tr></thead><tbody id="rows"></tbody></table>
  <canvas id="seen" width="1080" height="1080"></canvas>
  <pre id="status"></pre>
</main>
<script type="module">
const SIZE = 1080, COUNTS = [24, 100, 500, 2000], FRAMES = 30;
const rows = document.getElementById('rows'), status = document.getElementById('status');
const report = (name, n, values) => {
  values.sort((a, b) => a - b);
  const row = rows.insertRow();
  for (const text of [name, n, values[values.length >> 1].toFixed(2), values[values.length - 1].toFixed(2)]) row.insertCell().textContent = text;
  window.results = [...(window.results ?? []), { name, n, median: values[values.length >> 1], worst: values[values.length - 1] }];
};
// The limaçon's circles, as coefficients, with what each one's style reads beside them.
const fill = (n, time) => {
  const data = new Float32Array(n * 8);
  const a = 8, x0 = (a + 1 / a) / 2, x1 = (x0 + 1) / 2, r1 = (a + 1) / 2 - x1;
  for (let i = 0; i < n; i++) {
    const angle = time - i * (2 * Math.PI / n);
    const x = r1 * Math.cos(angle) + x1, y = r1 * Math.sin(angle);
    const r = Math.hypot(x - 1, y);
    data.set([1 / r, x / r, y / r, (x * x + y * y - r * r) / r, Math.pow(0.9, i * 24 / n), 0, 0, 0], i * 8);
  }
  return data;
};
const WGSL = `
struct U { count: u32, width: u32, pixel: f32, pad: f32 };
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var data: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
  return vec4<f32>(vec2<f32>(f32(i & 1u), f32(i >> 1u)) * 4.0 - 1.0, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) frag: vec4<f32>) -> @location(0) vec4<f32> {
  let world = (frag.xy - vec2<f32>(${SIZE / 2}.0)) * u.pixel * vec2<f32>(1.0, -1.0) + vec2<f32>(4.5, 0.0);
  let m = dot(world, world);
  var color = vec3<f32>(0.0);
  for (var i = 0u; i < u.count; i++) {
    let at = vec2<i32>(i32((2u * i) % u.width), i32((2u * i) / u.width));
    let c = textureLoad(data, at, 0);
    let more = textureLoad(data, at + vec2<i32>(1, 0), 0);
    let f = c.x * m - 2.0 * (c.y * world.x + c.z * world.y) + c.w;
    let d = f / (1.0 + sqrt(max(1.0 + c.x * f, 0.0)));
    let negative = clamp(0.5 - d / u.pixel, 0.0, 1.0);
    let glow = mix(vec3<f32>(2.0, 1.0, 6.0), vec3<f32>(5.0, 1.0, 2.0), negative);
    color += more.x * glow * tanh(min(u.pixel / 2.0 / abs(d), 20.0));
  }
  return vec4<f32>(tanh(color), 1.0);
}`;
const GLSL_V = `#version 300 es
void main() { vec2 p = vec2(float(gl_VertexID & 1), float(gl_VertexID >> 1)) * 4.0 - 1.0; gl_Position = vec4(p, 0.0, 1.0); }`;
const GLSL_F = `#version 300 es
precision highp float; precision highp int;
uniform int count; uniform int width; uniform float pixel; uniform highp sampler2D data; out vec4 result;
void main() {
  vec2 world = (gl_FragCoord.xy - vec2(${SIZE / 2}.0)) * pixel + vec2(4.5, 0.0);
  float m = dot(world, world);
  vec3 color = vec3(0.0);
  for (int i = 0; i < count; i++) {
    ivec2 at = ivec2((2 * i) % width, (2 * i) / width);
    vec4 c = texelFetch(data, at, 0);
    vec4 more = texelFetch(data, at + ivec2(1, 0), 0);
    float f = c.x * m - 2.0 * (c.y * world.x + c.z * world.y) + c.w;
    float d = f / (1.0 + sqrt(max(1.0 + c.x * f, 0.0)));
    float negative = clamp(0.5 - d / pixel, 0.0, 1.0);
    vec3 glow = mix(vec3(2.0, 1.0, 6.0), vec3(5.0, 1.0, 2.0), negative);
    color += more.x * glow * tanh(min(pixel / 2.0 / abs(d), 20.0));
  }
  result = vec4(tanh(color), 1.0);
}`;
const WIDTH = 256, PIXEL = 12 / SIZE;
const webgl = async () => {
  const canvas = new OffscreenCanvas(SIZE, SIZE);
  const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) return;
  const compile = (type, source) => {
    const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, GLSL_V));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, GLSL_F));
  gl.linkProgram(program); gl.useProgram(program);
  gl.bindVertexArray(gl.createVertexArray());
  gl.viewport(0, 0, SIZE, SIZE);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.uniform1i(gl.getUniformLocation(program, 'width'), WIDTH);
  gl.uniform1f(gl.getUniformLocation(program, 'pixel'), PIXEL);
  const pixel = new Uint8Array(4);
  for (const n of COUNTS) {
    const texels = new Float32Array(WIDTH * Math.ceil(2 * n / WIDTH) * 4);
    gl.uniform1i(gl.getUniformLocation(program, 'count'), n);
    const times = [];
    for (let f = 0; f < FRAMES; f++) {
      const start = performance.now();
      texels.set(fill(n, f * 0.1));
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, WIDTH, texels.length / 4 / WIDTH, 0, gl.RGBA, gl.FLOAT, texels);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      times.push(performance.now() - start);
      if (f % 5 === 0) await new Promise(requestAnimationFrame);
    }
    report('WebGL2', n, times);
  }
  document.getElementById('seen').getContext('2d').drawImage(canvas, 0, 0);
};
const webgpu = async () => {
  const adapter = await navigator.gpu?.requestAdapter();
  if (!adapter) { status.textContent += 'No WebGPU here.\n'; return; }
  const device = await adapter.requestDevice();
  const target = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const module = device.createShaderModule({ code: WGSL });
  const pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module }, fragment: { module, targets: [{ format: 'rgba8unorm' }] } });
  const uniforms = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const readback = device.createBuffer({ size: 256, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  for (const n of COUNTS) {
    const height = Math.ceil(2 * n / WIDTH);
    const texture = device.createTexture({ size: [WIDTH, height], format: 'rgba32float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
    const head = new ArrayBuffer(16);
    new Uint32Array(head, 0, 2).set([n, WIDTH]);
    new Float32Array(head, 8, 1).set([PIXEL]);
    device.queue.writeBuffer(uniforms, 0, head);
    const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uniforms } }, { binding: 1, resource: texture.createView() }] });
    const texels = new Float32Array(WIDTH * height * 4);
    const times = [];
    for (let f = 0; f < FRAMES; f++) {
      const start = performance.now();
      texels.set(fill(n, f * 0.1));
      device.queue.writeTexture({ texture }, texels, { bytesPerRow: WIDTH * 16 }, [WIDTH, height]);
      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({ colorAttachments: [{ view: target.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
      pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
      encoder.copyTextureToBuffer({ texture: target }, { buffer: readback, bytesPerRow: 256 }, [1, 1]);
      device.queue.submit([encoder.finish()]);
      await readback.mapAsync(GPUMapMode.READ);
      readback.unmap();
      times.push(performance.now() - start);
    }
    report('WebGPU', n, times);
  }
};
document.getElementById('go').addEventListener('click', async () => {
  status.textContent = 'Measuring…\n';
  try { await webgpu(); await webgl(); status.textContent += 'Done.\n'; }
  catch (e) { status.textContent += e.message + '\n'; }
});
</script>
</body>
</html>
