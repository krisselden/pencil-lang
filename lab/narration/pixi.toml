[workspace]
name = "narration"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
montreal-forced-aligner = "*"

[pypi-dependencies]
kokoro = "*"
soundfile = "*"
openai-whisper = ">=20250625, <20250626"

[tasks]
models = "mfa model download acoustic english_us_arpa && mfa model download dictionary english_us_arpa"

# torch and the conda environment each bring an OpenMP runtime, and Whisper won't load with both.
[activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"
