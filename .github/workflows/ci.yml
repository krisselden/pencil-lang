name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to main while another is still building takes its place, so an older build never
# publishes over a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Whether the repo has what publishing needs. A fork, or a pull request from one, doesn't.
      CAN_PUBLISH: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # The command reads its label fonts from macOS for now, so a figure with text can't be drawn
      # here. Set this to 'true' once the fonts are in the repo.
      CAN_DRAW_TEXT: 'false'
    steps:
      - uses: actions/checkout@v4
      # A fixed version, so that a new release's lints don't fail a commit that didn't change.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so that the GPU path really runs here.
      - name: Install a software GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build for the web
        run: cargo build -p pencil-web --target wasm32-unknown-unknown --release --locked
      # Unlike the test that uses a GPU, this fails if there isn't one.
      - name: Compare the GPU with the CPU oracle
        run: |
          cargo build -p pencil-cli --release --locked
          check() {
            ./target/release/pencil check "corpus/$1" --style corpus/theme.style --style "corpus/$2" --t 1 --size 320
          }
          check 009-squaring/squaring.pen 009-squaring/plain.style
          check 010-mobius/mobius.pen 010-mobius/plain.style
          check 011-circumcircle/circumcircle.pen 011-circumcircle/plain.style
          check 012-limacon/limacon.pen 012-limacon/plain.style
      # The site, built as a reader gets it. Its posters are drawn here, on the software GPU.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the packages
        run: pnpm install --frozen-lockfile
      # wasm-bindgen's command, which scripts/build-web.sh installs when it isn't there.
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build-web.sh') }}
      - name: Build the package's WASM
        run: scripts/build-web.sh
      - name: Build the site
        if: env.CAN_DRAW_TEXT == 'true'
        run: pnpm --dir site build
      # Only from main, and only after everything above has passed.
      - name: Publish the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CAN_PUBLISH == 'true' && env.CAN_DRAW_TEXT == 'true'
        run: pnpm --dir site exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
