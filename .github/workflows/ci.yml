name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to main while another is still building takes its place, so an older build never
# publishes over a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # To push the built site to the `deploy` branch. A pull request from a fork doesn't get this.
    permissions:
      contents: write
    env:
      # The command has its label fonts built in, from packages/figure/fonts, so a figure with text
      # is drawn here as it is anywhere.
      CAN_DRAW_TEXT: 'true'
    steps:
      - uses: actions/checkout@v4
      # A fixed version, so that a new release's lints don't fail a commit that didn't change.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # A software Vulkan driver, so that the GPU path really runs here.
      - name: Install a software GPU
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build for the web
        run: cargo build -p pencil-web --target wasm32-unknown-unknown --release --locked
      # Unlike the test that uses a GPU, this fails if there isn't one.
      - name: Compare the GPU with the CPU oracle
        run: |
          cargo build -p pencil-cli --release --locked
          check() {
            ./target/release/pencil check "corpus/$1" --style corpus/theme.style --style "corpus/$2" --t 1 --size 320
          }
          check 009-squaring/squaring.pen 009-squaring/plain.style
          check 010-mobius/mobius.pen 010-mobius/plain.style
          check 011-circumcircle/circumcircle.pen 011-circumcircle/plain.style
          check 012-limacon/limacon.pen 012-limacon/plain.style
      # The site, built as a reader gets it. Its posters are drawn here, on the software GPU.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the packages
        run: pnpm install --frozen-lockfile
      # wasm-bindgen's command, which scripts/build-web.sh installs when it isn't there.
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build-web.sh') }}
      - name: Build the package's WASM
        run: scripts/build-web.sh
      - name: Build the site
        if: env.CAN_DRAW_TEXT == 'true'
        run: pnpm --dir site build
      # Only from main, and only after everything above has passed. Cloudflare is connected to the
      # repo and publishes what it finds on the `deploy` branch, with no build of its own: it can't
      # build the site, which takes Rust and a GPU. The branch is one commit, replaced each time,
      # holding the built files and the Worker's config, so the repo doesn't grow with every build.
      - name: Hand the built site to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CAN_DRAW_TEXT == 'true'
        run: |
          out="$(mktemp -d)"
          cp -R site/dist "$out/dist"
          cp site/wrangler.jsonc "$out/wrangler.jsonc"
          cd "$out"
          git init --quiet --initial-branch=deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet --message "The site, built from $GITHUB_SHA"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
