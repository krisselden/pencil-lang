<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>framed playground</title>
<style>
  /* As the site frames the playground at /playground/: a bar above, the frame filling the rest. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }
  .bar { padding: 12px 16px; border-bottom: 1px solid #ccc; font: 14px system-ui, sans-serif; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
  html.held, html.held body { overflow: hidden; overscroll-behavior: none; }
  html.held body { position: fixed; left: 0; top: 0; width: 100%; height: var(--app-h, 100dvh); transform: translateY(var(--app-top, 0px)); }
</style>
</head>
<body>
<div class="bar">A page that frames the playground</div>
<iframe id="playground" title="Pencil playground" allow="fullscreen; clipboard-write"></iframe>
<script type="module">
  // On a touch screen, it holds itself and the frame to what's visible, as the site's page does.
  import { touch, holdToViewport } from '/web/viewport.js';
  let hold = null;
  const follow = () => {
    document.documentElement.classList.toggle('held', touch.matches);
    if (touch.matches) hold ??= holdToViewport(document.body);
    hold?.(touch.matches);
  };
  follow();
  touch.addEventListener('change', follow);
</script>
<script>
  // This page's query goes to the frame, as `?figure=` does on the site; its hash doesn't, so the
  // playground has to read a link from this page's address.
  document.getElementById('playground').src = `/web/playground.html${location.search}`;
</script>
</body>
</html>
