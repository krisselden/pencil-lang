<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scroll</title>
<!-- A page as a site has it: text beside a figure with a handle, tall enough to scroll, and no CSS
     for the figure, so a drag and a scroll are the element's own. -->
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 8px; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  .after { height: 250vh; }
</style>
</head>
<body>
<main>
  <pencil-figure id="figure" src="../../../../corpus/004-bounds/bounds.pen" sheets="../../../../corpus/theme.style ../../../../corpus/004-bounds/blog.style" paused
    aria-label="A ruler-and-compass construction of the two boundary Doyle flowers."></pencil-figure>
  <p id="text">Drag P around the circle. The flowers follow it, and the page around the figure is text a reader
    can select, as any page's is, but not by dragging a handle across it.</p>
</main>
<div class="after"></div>
<script type="module" src="./boot.js"></script>
</body>
</html>
