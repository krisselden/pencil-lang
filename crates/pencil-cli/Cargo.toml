[package]
name = "pencil-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pencil"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
pencil-core.workspace = true
pencil-render.workspace = true
png = "0.18"
serde_json.workspace = true
# libwebp, for posters: the reference encoder, built from its C source. Only the CLI has it.
webp = { version = "0.3", default-features = false }
