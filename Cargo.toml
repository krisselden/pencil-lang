[workspace]
resolver = "3"
members = ["crates/pencil-core", "crates/pencil-render", "crates/pencil-cli", "crates/pencil-web"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
pencil-core = { path = "crates/pencil-core" }
pencil-render = { path = "crates/pencil-render" }
serde_json = "1"
wgpu = "30"
