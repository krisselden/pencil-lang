<!doctype html>
<html lang="en">
<head>
<script src="./imports.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil playground</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 512px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  pencil-figure::part(canvas) { border-radius: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { flex: 1; min-width: 120px; }
  output { font-variant-numeric: tabular-nums; min-width: 5ch; }
  button, select { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <h1>Pencil playground: circle.pen</h1>
  <pencil-figure id="figure" src="../corpus/001-circle/circle.pen" sheets="../corpus/001-circle/circle.style"
    aria-label="A circle that breathes, its radius swinging a quarter either side of 1."></pencil-figure>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <label for="time">time</label>
    <input id="time" type="range" min="0" max="10" step="0.001" value="0">
    <output id="time-value" for="time">0.00</output>
    <label>style
      <select id="style">
        <option value="circle.style">circle.style</option>
        <option value="bands.style">bands.style</option>
      </select>
    </label>
  </div>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report, playButton, timeSlider, watch } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));
  playButton(figure, $('play'));
  // The slider and the clock set the same time: moving it pauses the clock.
  timeSlider(figure, $('time'), $('time-value'));
  // A new sheet keeps the time where it is. Edit either file and the figure reloads.
  $('style').addEventListener('change', () => figure.setAttribute('sheets', `../corpus/001-circle/${$('style').value}`));
  watch(figure);

  window.pencil = { figure };
</script>
</body>
</html>
