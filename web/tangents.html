<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangents and Chords</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 765px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .stage { position: relative; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; }
  .label { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
           font-family: system-ui, -apple-system, sans-serif; line-height: 1;
           paint-order: stroke; -webkit-text-stroke-color: transparent; will-change: transform; }
  .label.math { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-style: italic; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 14rem; max-width: 100%; }
  output { font-variant-numeric: tabular-nums; }
  p { margin: 4px 0; color: var(--muted); }
  #readout { color: var(--ink); font-variant-numeric: tabular-nums; }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>A point and a circle: two tangents outside, a chord inside</h1>
  <div class="stage" id="stage"><canvas id="figure" aria-label="A circle and a point P. With P outside the circle, the two tangents from P are drawn. With P inside, the chord through P at right angles to OP is drawn."></canvas></div>
  <div class="controls">
    <label>distance of P from O <input id="d" type="range" min="0.15" max="3.2" step="0.001" value="3"></label>
    <output id="d-value" for="d"></output>
    <span>Or drag P.</span>
  </div>
  <p id="readout" aria-live="polite"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import init, { Player } from './pkg/pencil_web.js';

  const BASE = '../corpus/005-tangents/';
  const $ = (id) => document.getElementById(id);
  const canvas = $('figure');
  const stage = $('stage');
  const params = new URLSearchParams(location.search);

  const read = async (name) => {
    const response = await fetch(BASE + name, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${name}: ${response.status}`);
    return response.text();
  };

  const doc = await read('tangents.pen');
  const style = await read('plain.style');
  const design = {
    width: Number(/width:\s*([\d.]+)/.exec(doc)[1]),
    height: Number(/height:\s*([\d.]+)/.exec(doc)[1]),
  };
  const dpr = window.devicePixelRatio || 1;
  canvas.style.aspectRatio = `${design.width} / ${design.height}`;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round((canvas.clientWidth * design.height / design.width) * dpr);
  const scale = canvas.width / design.width;

  await init();
  const player = await Player.create(canvas, params.has('gl'));
  const TIME = 0;
  let dirty = true;

  const setDistance = (value) => {
    player.set_param('d', value);
    dirty = true;
  };
  try {
    player.load(doc, [style]);
    setDistance(Number($('d').value));
    $('status').textContent = `${player.backend}, ${canvas.width}×${canvas.height}`;
  } catch (e) {
    $('error').textContent = `tangents.pen or plain.style: ${e.message}`;
  }
  $('d').addEventListener('input', () => setDistance(Number($('d').value)));

  const device = (e) => {
    const box = canvas.getBoundingClientRect();
    return [(e.clientX - box.left) * (canvas.width / box.width), (e.clientY - box.top) * (canvas.height / box.height)];
  };
  canvas.addEventListener('pointerdown', (e) => {
    const [x, y] = device(e);
    if (player.grab(TIME, x, y, 24 * dpr)) {
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
      player.drag(TIME, x, y);
      dirty = true;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    const [x, y] = device(e);
    if (!canvas.hasPointerCapture(e.pointerId)) {
      canvas.style.cursor = player.grab(TIME, x, y, 24 * dpr) ? 'grab' : '';
      player.release();
      return;
    }
    player.drag(TIME, x, y);
    dirty = true;
  });
  const end = (e) => {
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    player.release();
    canvas.style.cursor = '';
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  const spans = new Map();
  const drawLabels = (labels) => {
    const present = new Set();
    for (const label of labels) {
      present.add(label.id);
      let span = spans.get(label.id);
      if (!span) {
        span = document.createElement('span');
        span.className = 'label';
        stage.append(span);
        spans.set(label.id, span);
      }
      if (span.textContent !== label.text) span.textContent = label.text;
      span.hidden = false;
      span.classList.toggle('math', label.math);
      span.style.fontSize = `${label.size / dpr}px`;
      span.style.color = label.color;
      span.style.webkitTextStrokeColor = label.haloColor;
      span.style.webkitTextStrokeWidth = `${label.halo / dpr}px`;
      span.style.opacity = label.opacity;
      span.style.transform = `translate(${label.x / dpr}px, ${label.y / dpr}px) translate(-50%, -50%)`;
    }
    // A label that isn't listed doesn't exist this frame.
    for (const [id, span] of spans) span.hidden = !present.has(id);
  };

  const draw = () => {
    drawLabels(JSON.parse(player.draw(TIME, scale)));
    const v = (name) => player.value(name, TIME);
    const d = v('d');
    $('d').value = d;
    $('d-value').textContent = d.toFixed(3);
    $('readout').textContent = v('outside')
      ? `P is outside the circle: each tangent has length ${v('tangent_length').toFixed(3)}.`
      : `P is inside the circle: it has no tangents, and the chord reaches ${v('half_chord').toFixed(3)} each way.`;
  };

  const frame = () => {
    if (dirty) {
      dirty = false;
      try {
        draw();
      } catch (e) {
        $('error').textContent = e.message;
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  window.pencil = { player, scale, dpr, draw, setDistance, redraw() { dirty = true; } };
</script>
</body>
</html>
