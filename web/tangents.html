<!doctype html>
<html lang="en">
<head>
<script src="./imports.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tangents and Chords</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 765px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  pencil-figure { touch-action: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 14rem; max-width: 100%; }
  output { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #readout { color: var(--ink); font-variant-numeric: tabular-nums; }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <h1>A point and a circle: two tangents outside, a chord inside</h1>
  <pencil-figure id="figure" src="../corpus/005-tangents/tangents.pen" sheets="../corpus/theme.style ../corpus/005-tangents/plain.style"
    paused params="d: 3"
    aria-label="A circle and a point P. With P outside the circle, the two tangents from P are drawn. With P inside, the chord through P at right angles to OP is drawn."></pencil-figure>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <label>distance of P from O <input id="d" type="range" min="0.15" max="3.2" step="0.001" value="3"></label>
    <output id="d-value" for="d"></output>
    <span>Or drag P.</span>
  </div>
  <p id="readout" aria-live="polite"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report, playButton } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));
  // It starts held at d = 3. Time sweeps P in and out, and playing carries on from where P is.
  playButton(figure, $('play'));

  // The slider and a drag on P set the same param.
  $('d').addEventListener('input', () => {
    figure.pause();
    figure.hold('d', Number($('d').value));
  });
  figure.addEventListener('load', () => {
    const d = figure.info.params.find((p) => p.id === 'd');
    Object.assign($('d'), { min: d.min, max: d.max });
  });
  figure.addEventListener('draw', () => {
    const v = (name) => figure.value(name);
    const d = v('d');
    $('d').value = d;
    $('d-value').textContent = d.toFixed(3);
    $('readout').textContent = v('outside')
      ? `P is outside the circle: each tangent has length ${v('tangent_length').toFixed(3)}.`
      : `P is inside the circle: it has no tangents, and the chord reaches ${v('half_chord').toFixed(3)} each way.`;
  });

  window.pencil = { figure };
</script>
</body>
</html>
