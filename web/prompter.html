<!doctype html>
<html lang="en">
<head>
<script src="./imports.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompter</title>
<style>
  /* The figure is drawn on the dark sheet, so the page is dark too. */
  :root { color-scheme: dark; --ink: #f3f0ea; --paper: #171614; --muted: #8f8a81; --dim: #4d4a45;
          --rule: #3a3833; --lit: #f6c453; --rec: #e5534b; --bad: #e58a80; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif;
         display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  :focus-visible { outline: 2px solid var(--lit); outline-offset: 2px; }
  .stage { width: min(100%, calc(52vh * 16 / 9)); margin: 0 auto; }
  /* The script, with the line being said held at the middle. */
  .prompt { position: relative; overflow: hidden; min-height: 9em;
            -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent);
                    mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
  .prompt[hidden] { display: none; }
  .lines { position: absolute; left: 0; right: 0; top: 50%; padding: 0 16px; text-align: center;
           transition: transform 0.45s ease; }
  .line { margin: 0 auto; max-width: 30em; font-size: clamp(1.25rem, 3.6vw, 2.125rem); line-height: 1.3;
          padding: 0.25em 0; color: var(--dim); transition: color 0.3s; }
  .line.next { color: var(--muted); }
  .line.now { color: var(--ink); }
  /* With a section picked, only its lines are there to read. */
  .line.out { display: none; }
  .word { cursor: pointer; }
  /* A word fills from the left as it's said, as far as --fill says. */
  .line.now .word { color: transparent; -webkit-background-clip: text; background-clip: text;
                    background-image: linear-gradient(90deg, var(--lit) calc(var(--fill, 0) * 100%),
                                                      var(--ink) calc(var(--fill, 0) * 100%)); }
  .count { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
           font-size: 22vh; font-weight: 600; color: var(--lit); text-shadow: 0 0 24px #000; }
  /* `display: grid` above would otherwise outrank the `hidden` attribute. */
  .count[hidden] { display: none; }
  /* The takes of the section picked, in the script's place while they're open. */
  .takes { overflow-y: auto; padding: 8px 16px; }
  .takes[hidden] { display: none; }
  .takes fieldset { margin: 0 auto; max-width: 34rem; border: 0; padding: 0; }
  .takes legend { padding: 0; margin-bottom: 6px; color: var(--muted); }
  .takes legend strong { color: var(--ink); font-weight: 600; }
  .choice { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--rule); }
  .choice label { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
  .choice input { flex: none; accent-color: var(--lit); }
  .choice .note { color: var(--muted); font-size: 0.8125rem; }
  .choice.kept label { color: var(--lit); }
  .choice button { flex: none; }
  .takes .hint { color: var(--muted); font-size: 0.8125rem; margin: 10px auto 0; max-width: 34rem; }
  .sections { margin: 0 auto; padding: 0; max-width: 34rem; list-style: none; }
  .sections button { width: 100%; display: flex; gap: 10px; align-items: baseline; text-align: left;
                     padding: 6px 4px; border: 0; border-top: 1px solid var(--rule); border-radius: 0;
                     background: none; color: var(--ink); cursor: pointer; }
  .sections .note { margin-left: auto; color: var(--muted); font-size: 0.8125rem; white-space: nowrap; }
  .sections .kept .note { color: var(--lit); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center;
              padding: 10px 16px 14px; color: var(--muted); }
  .bar { display: flex; gap: 8px; align-items: center; min-width: 0; }
  button, select { font: inherit; padding: 4px 12px; }
  #section { max-width: 18rem; text-overflow: ellipsis; }
  /* A popover that a wide window shows in place, in the bar. */
  .options { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: inherit;
             position: static; inset: auto; margin: 0; padding: 0; border: 0; background: none;
             width: auto; height: auto; overflow: visible; }
  .more { display: none; }
  .status { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: center; }
  output { font-variant-numeric: tabular-nums; }
  #recording { color: var(--rec); font-weight: 600; }
  #take { color: var(--ink); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
  #error:empty { display: none; }
  @media (hover: none) { .keys { display: none; } }
  /* A narrow window keeps one bar: what to read, Start, the takes, and the rest behind a button. */
  @media (max-width: 640px) {
    .controls { flex-direction: column; flex-wrap: nowrap; gap: 4px; padding: 6px 8px 8px; }
    .bar { width: 100%; }
    #section { flex: 1; min-width: 0; max-width: none; padding: 4px 6px; }
    .bar button { padding: 4px 10px; }
    .more { display: block; }
    .options:not(:popover-open) { display: none; }
    .options:popover-open { position: fixed; inset: auto; margin: 0; flex-direction: column; align-items: stretch;
                            gap: 8px; padding: 10px; border: 1px solid var(--rule); border-radius: 6px;
                            background: var(--paper); color: var(--ink); box-shadow: 0 6px 24px rgb(0 0 0 / 0.5); }
    .status { font-size: 0.8125rem; }
  }
  /* A phone on its side: the figure and the words side by side. */
  @media (orientation: landscape) and (max-height: 520px) {
    body { grid-template-columns: 1.15fr 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    .stage { width: 100%; align-self: center; }
    .prompt, .takes { grid-column: 2; grid-row: 1; }
    .line { font-size: clamp(1.125rem, 3vw, 1.625rem); }
    .controls { grid-column: 1 / -1; padding: 4px 12px 8px; }
  }
</style>
</head>
<body>
<div class="stage">
  <pencil-figure id="figure" paused aria-label="The figure the narration is read along with."></pencil-figure>
</div>
<div class="prompt" id="prompt"><div class="lines" id="lines"></div></div>
<section class="takes" id="takes" hidden aria-label="Takes"></section>
<div class="controls">
  <div class="bar">
    <select id="section" aria-label="What to read" hidden></select>
    <button id="start" type="button">Start</button>
    <button id="show-takes" type="button" aria-expanded="false" aria-controls="takes" hidden>Takes</button>
    <button class="more" id="more" type="button" popovertarget="options" aria-label="More: from the top, record, the guide">⋯</button>
    <div class="options" id="options" popover>
      <button id="restart" type="button">From the top</button>
      <label><input id="record" type="checkbox" checked> Record</label>
      <label title="On headphones: the microphone hears speakers."><input id="guide" type="checkbox"> Hear the guide</label>
      <button id="playback" type="button" hidden>Play back</button>
    </div>
  </div>
  <div class="status">
    <output id="clock">0.0 s</output>
    <span id="recording" hidden>● Recording</span>
    <span id="take" aria-live="polite"></span>
    <span class="keys">Space starts and stops, when no control has focus. Tap a word to start just before it.</span>
    <span id="error" role="alert"></span>
  </div>
</div>
<div class="count" id="count" hidden></div>
<audio id="audio" preload="auto"></audio>
<audio id="heard"></audio>
<script type="module">
  // A teleprompter for recording a figure's narration. The figure plays as `narrate.py retime`
  // timed it, and each word of the script lights up as it's due, so a reader can say it with the
  // picture. `?take=name` reads lab/narration/out/name.pen, .prompt.json and .wav.
  //
  // With Record on, the microphone runs from the moment the figure starts until it stops, and the
  // take goes to `scripts/serve.py`, with the figure's time it started at. A take is in step with
  // the figure by construction, so `narrate.py video` puts it on the rendered figure as it is.
  //
  // A recording never ends on its own: at the figure's end, or the end of the section picked, the
  // figure waits and the microphone runs on until the reader stops it, so a reader slower than the
  // draft isn't cut off.
  //
  // A script comes in sections, a part of the figure each, as `retime` lists them in the prompt.
  // Picking one shows only its lines, and a take of it starts just before its first word and the
  // figure waits before the next section's. Takes shows the takes that hold the section picked, each played
  // back on the figure it was read with, and which one is kept for it, which the server keeps
  // beside the takes and `narrate.py join` reads.
  import '@pencil-lang/figure';

  const $ = (id) => document.getElementById(id);
  const search = new URLSearchParams(location.search);
  const narration = search.get('take') ?? 'limacon';
  const dir = '../lab/narration/out';
  const out = `${dir}/${narration}`;
  const pen = `${out}.pen`;
  const sheets = search.get('sheets')
    ?? '../corpus/theme.style ../corpus/dark.style ../lab/explainer/limacon.style ../lab/explainer/caption.style';
  // Seconds of count-in, how far before a tapped word to start, and the shortest take worth keeping.
  const COUNT = 3, BEFORE = 1.5, SHORTEST = 1;
  // A line becomes the one to read only just before its first word is due. Until then it waits
  // dimmed below the line just said, so a reader holds through the figure's pauses instead of
  // starting early. Words light a little early too, since reading one takes a moment.
  const LINE_LEAD = 0.6, WORD_LEAD = 0.25;
  // The least a take of a section runs past its last word.
  const TAIL = 0.5;

  const figure = $('figure');
  if (search.has('gl')) figure.setAttribute('gl', '');
  figure.setAttribute('sheets', sheets);
  $('audio').src = `${out}.wav`;

  async function fetchPrompt(url) {
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${url}: ${response.status}`);
    return response.json();
  }
  let current;
  try {
    current = await fetchPrompt(`${out}.prompt.json`);
  } catch (e) {
    $('error').textContent = `${e.message}. Run narrate.py retime first.`;
    throw e;
  }

  // ---- Sections ----

  // Each holds the lines from `lines[0]` up to `lines[1]`. A prompt from before sections has one
  // way to read: all of it.
  const sectionsOf = (p) => p.sections ?? [];
  const firstWord = (p, s) => p.lines[s.lines[0]][0][1];
  const lastWord = (p, s) => p.lines[s.lines[1] - 1].at(-1)[2];
  /** Where a take of a section starts: a little before its first word, as from a tapped word. */
  const from = (p, s) => Math.max(0, firstWord(p, s) - BEFORE);
  /** Where it stops: before the next section's first line comes up, or at the figure's end. */
  function until(p, s) {
    const next = sectionsOf(p)[sectionsOf(p).indexOf(s) + 1];
    return next ? Math.max(lastWord(p, s) + TAIL, firstWord(p, next) - LINE_LEAD) : Infinity;
  }
  let picked = null;
  const pickedIn = (p) => sectionsOf(p).find((s) => s.name === picked);

  // ---- The script and the figure ----

  // The prompt and the figure on show: the figure as timed now, or the one a take was read with,
  // while that take plays back.
  let prompt = null, rows = [], shownPen = null, shown = null;

  /** The script, a line a row and a word a span. */
  function build(p) {
    prompt = p;
    rows = p.lines.map((words) => {
      const row = document.createElement('p');
      row.className = 'line';
      for (const [text, start] of words) {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = text;
        span.addEventListener('click', () => seek(start - BEFORE));
        row.append(span, ' ');
      }
      return row;
    });
    $('lines').replaceChildren(...rows);
    shown = null;
  }

  /** Shows a figure and its prompt, and resolves when that figure has loaded. `ready` is the
   * latest such promise, which a take waits for before it starts. */
  let ready = Promise.resolve();
  function showFigure(src, p) {
    if (prompt !== p) build(p);
    if (shownPen === src) return ready;
    shownPen = src;
    ready = new Promise((resolve) => {
      const done = () => {
        // A figure asked for before this one can finish loading after it was replaced.
        if (figure.getAttribute('src') !== src) return;
        figure.removeEventListener('load', done);
        figure.removeEventListener('error', done);
        resolve();
      };
      figure.addEventListener('load', done);
      figure.addEventListener('error', done);
      figure.setAttribute('src', src);
    });
    return ready;
  }

  const words = (i) => prompt.lines[i];
  const lineAt = (t) => {
    let i = 0;
    while (i + 1 < rows.length && t >= words(i + 1)[0][1] - LINE_LEAD) i += 1;
    return i;
  };

  const show = (t) => {
    let i = lineAt(t), waiting = false;
    const s = pickedIn(prompt);
    const [a, b] = s ? s.lines : [0, rows.length];
    // A section's first line waits below until it's due, and its last stays once said.
    if (i < a) [i, waiting] = [a, true];
    else if (i >= b) i = b - 1;
    const key = `${picked} ${i} ${waiting}`;
    if (key !== shown) {
      rows.forEach((row, k) => {
        const state = k < a || k >= b ? ' out' : k === i ? (waiting ? ' next' : ' now') : k === i + 1 ? ' next' : '';
        row.className = 'line' + state;
      });
      const row = rows[i];
      $('lines').style.transform = `translateY(${-(row.offsetTop + row.offsetHeight / 2)}px)`;
      shown = key;
    }
    rows[i].querySelectorAll('.word').forEach((span, k) => {
      const [, start, end] = words(i)[k];
      const lit = (t + WORD_LEAD - start) / (end - start);
      span.style.setProperty('--fill', Math.min(Math.max(lit, 0), 1));
    });
    $('clock').textContent = `${t.toFixed(1)} s`;
  };

  // The figure's clock loops, and a take shouldn't: the figure stops at its end instead, which
  // can come after the last word, or where a section or a take being played back ends. While a
  // take is being recorded, or played back with more of it to come, it waits there instead, and
  // the sound runs on.
  const end = () => figure.duration;
  let last = 0, stopAt = Infinity, holdOn = false, held = null, guideFrom = null, following = null;
  figure.addEventListener('draw', () => {
    const t = figure.time;
    const at = Math.min(end(), stopAt);
    if (!figure.paused && (t < last - 1 || t >= at - 0.02)) {
      figure.time = at;
      last = at;
      show(at);
      if (recording() || holdOn) hold(at);
      else stop(at);
      return;
    }
    // A take being played back sets the time: a figure slow to draw after loading would drift.
    if (following !== null && !heard.paused && Math.abs(following + heard.currentTime - t) > 0.08) {
      place(following + heard.currentTime);
      return;
    }
    // The guide, held back through a section take's lead-in, comes in where its section does.
    if (guideFrom !== null && !figure.paused && t >= guideFrom) {
      guideFrom = null;
      guide.currentTime = t;
      guide.play().catch(() => {});
    }
    last = t;
    show(t);
  });
  figure.addEventListener('load', () => show(figure.time));
  figure.addEventListener('error', (e) => { $('error').textContent = String(e.detail.error?.message ?? e.detail.error); });
  showFigure(pen, current);

  // ---- Recording ----

  let stream = null, recorder = null, lastTake = null;
  // Safari records MP4, the others WebM.
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
    .find((t) => window.MediaRecorder?.isTypeSupported(t)) ?? '';
  const recording = () => recorder?.state === 'recording';
  const say = (text) => { $('take').textContent = text; };
  const fail = (text) => { $('error').textContent = text; };

  /** The microphone, asked for once. Its processing is off: the aligner wants the voice as said. */
  async function microphone() {
    stream ??= await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    return stream;
  }

  /** Starts the figure and the microphone together, and notes the figure's time the take
   * starts at and the section it's of. */
  function record() {
    const chunks = [];
    const take = new MediaRecorder(stream, type ? { mimeType: type } : {});
    take.section = picked;
    take.addEventListener('dataavailable', (e) => e.data.size && chunks.push(e.data));
    take.addEventListener('start', () => {
      take.began = figure.time;
      figure.play();
      $('recording').textContent = '● Recording';
      $('recording').hidden = false;
    }, { once: true });
    take.addEventListener('stop', () => {
      $('recording').hidden = true;
      const blob = new Blob(chunks, { type: take.mimeType || type || 'audio/webm' });
      keep(blob, take.began, take.finished, take.section);
    }, { once: true });
    recorder = take;
    take.start();
  }

  /** The sections a take holds whole: it was running from before a section's first word until
   * its last was due. A take started from a word inside a section, or stopped before its end,
   * doesn't hold it. */
  const holding = (start, finish) => sectionsOf(current)
    .filter((s) => start <= firstWord(current, s) - 0.1 && finish >= lastWord(current, s));

  /** Sends a take to the server, which keeps it, and keeps it here to play back. It names the
   * section it was recorded as, if it holds it, and each section it holds. `finish` is the
   * figure's time it ended or waited at; the recording can run on past it. */
  async function keep(blob, start, finish, section) {
    if (!(finish - start >= SHORTEST)) return;
    lastTake = { url: URL.createObjectURL(blob), start, finish };
    $('playback').hidden = false;
    const range = `${start.toFixed(1)}–${finish.toFixed(1)} s`;
    say(`Saving the take, ${range}…`);
    const holds = holding(start, finish).map((s) => s.name);
    const query = new URLSearchParams({
      take: narration, start: start.toFixed(3), end: finish.toFixed(3), sheets, sections: holds.join(','),
    });
    const s = sectionsOf(current).find((s) => s.name === section);
    if (s && holds.includes(s.name)) query.set('section', section);
    try {
      const saved = await fetch(`/takes?${query}`, {
        method: 'POST', headers: { 'Content-Type': blob.type }, body: blob,
      });
      if (!saved.ok) throw new Error(`${saved.status}`);
      const { take } = await saved.json();
      if (!served) return await loadTakes();
      if (take) takes.push(take);
      const why = s && start > firstWord(current, s) - 0.1
        ? 'it started after its first word' : 'it stopped before its last word was due';
      say(!s ? `Saved the take, ${range}.`
        : holds.includes(s.name) ? `Saved take ${takesOf(s).length} of “${s.title}”, ${range}.`
        : `Saved, but not as a take of “${s.title}”: ${why}.`);
      render();
    } catch (e) {
      // A server that doesn't keep takes: the take can still be saved by hand.
      const link = document.createElement('a');
      link.href = lastTake.url;
      link.download = `${narration}-at-${start.toFixed(2)}s.${blob.type.includes('mp4') ? 'm4a' : 'webm'}`;
      link.textContent = 'Save it';
      $('take').replaceChildren(`The server didn't keep the take (${e.message}). `, link);
    }
  }

  // ---- Playing ----

  // `generation` counts what the reader set going, so a figure coming back from a take's
  // playback doesn't move one started since.
  let counting = 0, borrowed = false, generation = 0;
  const guide = $('audio'), heard = $('heard');

  /** Where a section's own words begin: halfway through the silence before them. */
  function sectionFrom(p, s) {
    const before = sectionsOf(p)[sectionsOf(p).indexOf(s) - 1];
    return before ? (lastWord(p, before) + firstWord(p, s)) / 2 : 0;
  }

  function go() {
    const s = pickedIn(current);
    stopAt = s ? until(current, s) : Infinity;
    if ($('record').checked && stream) record();
    else figure.play();
    // A section take's lead-in holds the end of the section before, which the microphone would
    // hear from speakers, so the guide comes in with the section.
    if ($('guide').checked) {
      const from = s && recording() ? sectionFrom(current, s) : 0;
      if (figure.time >= from) {
        guide.currentTime = figure.time;
        guide.play().catch(() => {});
      } else {
        guideFrom = from;
      }
    }
    $('start').textContent = 'Stop';
  }

  /** The figure waits at `at` while the sound runs on: a take still being recorded, or the rest
   * of one being played back. */
  function hold(at) {
    following = null;
    figure.pause();
    guide.pause();
    guideFrom = null;
    held = at;
    if (recording()) {
      $('recording').textContent = '● Still recording. The figure waits here: stop when you’ve finished.';
    }
  }

  /** Puts the figure at `t` without stopping anything. */
  function place(t) {
    figure.time = Math.max(0, t);
    last = figure.time;
    show(figure.time);
  }

  /** Stops everything, and ends a take at `at`, the figure's time, or where the figure waited.
   * After a take read with an earlier timing plays back, the figure as timed now comes back. */
  function stop(at = figure.time) {
    clearInterval(counting);
    counting = 0;
    $('count').hidden = true;
    if (recording()) {
      recorder.finished = held ?? at;
      recorder.stop();
    }
    figure.pause();
    guide.pause();
    heard.pause();
    stopAt = Infinity;
    holdOn = false;
    held = null;
    guideFrom = null;
    following = null;
    if (playing) playingIs(null);
    $('start').textContent = 'Start';
    if (borrowed) {
      borrowed = false;
      const g = ++generation;
      showFigure(pen, current).then(() => { if (g === generation) place(startOf()); });
    }
  }

  // A phone would lock its screen partway through a take, so it's kept awake once she starts.
  let awake = null;
  const stayAwake = async () => {
    try { if (!awake || awake.released) awake = await navigator.wakeLock?.request('screen'); } catch {}
  };
  document.addEventListener('visibilitychange', () => { if (awake && !document.hidden) stayAwake(); });

  /** Where reading starts: the section picked, or the top. */
  const startOf = () => (pickedIn(current) ? from(current, pickedIn(current)) : 0);

  // Counts in, then plays from where it is, or from the start of the section picked if it's
  // outside it.
  async function start() {
    const g = ++generation;
    stayAwake();
    fail('');
    // The script comes back in place of the takes, to be read.
    if (open) {
      open = false;
      render();
    }
    $('start').textContent = 'Stop';
    await ready;
    if (g !== generation) return;
    const s = pickedIn(current), t = figure.time;
    if (s ? t < from(current, s) - 0.01 || t >= until(current, s) - 0.05 : t >= end() - 0.05) place(startOf());
    if ($('record').checked) {
      try {
        await microphone();
      } catch (e) {
        fail(`No microphone: ${e.message}`);
        $('record').checked = false;
      }
      if (g !== generation) return;
    }
    let n = COUNT;
    $('count').textContent = n;
    $('count').hidden = false;
    counting = setInterval(() => {
      n -= 1;
      if (n > 0) { $('count').textContent = n; return; }
      clearInterval(counting);
      counting = 0;
      $('count').hidden = true;
      go();
    }, 1000);
  }

  const busy = () => counting || !figure.paused || recording() || !heard.paused;
  const toggle = () => {
    if (busy()) {
      generation += 1;
      stop();
    } else {
      start();
    }
  };

  function seek(t) {
    stop();
    place(t);
  }

  /** Plays a recording with the figure from `begin` to `finish`, the figure's times, where the
   * recording starts at `start`. With `rest`, the figure waits at `finish` while the recording
   * plays to its end, as a take recorded past the figure's waiting point was. */
  async function playWith(url, start, begin, finish, rest = false) {
    place(begin);
    heard.src = url;
    heard.currentTime = Math.max(0, begin - start);
    heard.onended = () => stop();
    stopAt = finish;
    holdOn = rest;
    $('start').textContent = 'Stop';
    try {
      await heard.play();
      // The recording can be under way by the time it says so, more so after a seek: the figure
      // starts where it is.
      place(start + heard.currentTime);
      following = start;
      figure.play();
    } catch (e) {
      fail(e.message);
      stop();
    }
  }

  /** The last take, with the figure from where it started. */
  function playBack() {
    if (!lastTake) return;
    generation += 1;
    stop();
    playWith(lastTake.url, lastTake.start, lastTake.start, lastTake.finish, true);
  }

  /** A take's part of a section, on the figure and prompt it was read with. Its Play button
   * says Stop while it plays, and stops it. */
  let playing = null;
  function playingIs(name) {
    for (const button of document.querySelectorAll('#takes [data-key^="play "]')) {
      const on = button.dataset.key === `play ${name}`;
      button.textContent = on ? 'Stop' : 'Play';
      button.setAttribute('aria-label', `${on ? 'Stop' : 'Play'} ${button.dataset.take}${on ? '' : ' with the figure'}`);
    }
    playing = name;
  }
  async function playTake(take, section) {
    const again = playing === take.name && busy();
    stop();
    if (again) return;
    const g = ++generation;
    playingIs(take.name);
    fail('');
    try {
      const p = take.current ? current : await fetchPrompt(`${dir}/takes/${take.name}.prompt.json`);
      if (g !== generation) return;
      borrowed = !take.current;
      await showFigure(take.current ? pen : `${dir}/takes/${take.name}.pen`, p);
      if (g !== generation) return;
      const theirs = sectionsOf(p).find((s) => s.name === section.name);
      const whole = !theirs || take.section === section.name;
      const begin = whole ? take.start : Math.max(take.start, from(p, theirs));
      const finish = whole ? take.end : Math.min(take.end, until(p, theirs));
      await playWith(`${dir}/takes/${take.recording}`, take.start, begin, finish, whole);
    } catch (e) {
      fail(`Can't play that take: ${e.message}`);
      stop();
    }
  }

  // ---- Takes, and which is kept for each section ----

  let takes = [], kept = {}, served = false, open = false;
  const takesOf = (s) => takes.filter((t) => t.sections?.includes(s.name));
  const titled = (s) => `${sectionsOf(current).indexOf(s) + 1}. ${s.title}`;
  const recordedAt = (t) => t.name.match(/-\d{8}-(\d\d)(\d\d)(\d\d)/)?.slice(1).join(':') ?? t.name;

  async function loadTakes() {
    try {
      const response = await fetch(`/takes?take=${encodeURIComponent(narration)}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${response.status}`);
      ({ takes, kept } = await response.json());
      served = true;
    } catch (e) {
      served = false;
      say(`This server doesn't list takes (${e.message}), so they can't be played back or kept here. `
        + 'scripts/serve.py keeps them.');
    }
    render();
  }

  // Each choice is sent once the one before is answered, so the server takes them in the order
  // they were made, and the last answer is what it keeps. The menu is drawn again once none is
  // waiting, so an earlier answer never shows over a later choice.
  let keeping = Promise.resolve(), waiting = 0;
  function setKept(section, name) {
    fail('');
    waiting += 1;
    keeping = keeping.then(async () => {
      try {
        const query = new URLSearchParams({ take: narration, section: section.name, keep: name });
        const response = await fetch(`/kept?${query}`, { method: 'POST' });
        if (!response.ok) throw new Error(`${response.status}`);
        ({ kept } = await response.json());
        const k = takesOf(section).findIndex((t) => t.name === name);
        say(name ? `Keeping take ${k + 1} for “${section.title}”.` : `The draft voice for “${section.title}”.`);
      } catch (e) {
        fail(`The server didn't keep that (${e.message}).`);
      }
      waiting -= 1;
      if (!waiting) render();
    });
  }

  const el = (tag, props = {}, ...children) => {
    const made = Object.assign(document.createElement(tag), props);
    made.append(...children);
    return made;
  };

  /** The section menu, the Takes button, and the panel: the takes of the section picked, or,
   * with the whole script, what's kept for each section. Focus stays on what it was on. */
  function render() {
    const sections = sectionsOf(current);
    const select = $('section');
    select.hidden = sections.length < 2;
    select.replaceChildren(
      el('option', { value: '', textContent: 'Whole script' }),
      ...sections.map((s) => el('option', { value: s.name, textContent: titled(s) + (kept[s.name] ? ' · take kept' : '') })),
    );
    select.value = picked ?? '';
    const button = $('show-takes');
    button.hidden = !served || !sections.length;
    const s = pickedIn(current);
    button.textContent = s ? `Takes (${takesOf(s).length})` : 'Takes';
    button.setAttribute('aria-expanded', String(open));
    $('takes').hidden = !open;
    $('prompt').hidden = open;
    if (!open) return;

    const focused = document.activeElement?.dataset?.key;
    const panel = $('takes');
    if (s) {
      const legend = el('legend', {}, 'Takes of ', el('strong', { textContent: titled(s) }));
      const choice = (key, value, label, note, take) => {
        const input = el('input', { type: 'radio', name: 'kept', value, checked: (kept[s.name] ?? '') === value });
        input.dataset.key = key;
        input.addEventListener('change', () => input.checked && setKept(s, value));
        const row = el('div', { className: 'choice' + (input.checked && value ? ' kept' : '') },
          el('label', {}, input, label, el('span', { className: 'note', textContent: note })));
        if (take) {
          const play = el('button', { type: 'button', textContent: playing === take.name ? 'Stop' : 'Play' });
          play.dataset.key = `play ${key}`;
          play.dataset.take = label.toLowerCase();
          play.setAttribute('aria-label', playing === take.name ? `Stop ${play.dataset.take}` : `Play ${play.dataset.take} with the figure`);
          play.addEventListener('click', () => playTake(take, s));
          row.append(play);
        }
        return row;
      };
      const rows = takesOf(s).map((t, k) => choice(t.name, t.name, `Take ${k + 1}`,
        [recordedAt(t), `${(t.end - t.start).toFixed(1)} s`, t.section === s.name ? '' : 'part of a longer take',
         t.current ? '' : 'read with an earlier timing'].filter(Boolean).join(' · '), t));
      panel.replaceChildren(
        el('fieldset', {}, legend, choice('draft', '', 'No take', 'the draft voice'), ...rows),
        el('p', { className: 'hint', textContent: rows.length
          ? 'The take picked is kept for this section, in place of the draft voice when the takes are joined.'
          : 'No take holds this section yet. Start records one.' }),
      );
    } else {
      panel.replaceChildren(
        el('fieldset', {}, el('legend', { textContent: 'What’s kept for each section' }),
          el('ul', { className: 'sections' }, ...sections.map((s) => {
            const k = takesOf(s).findIndex((t) => t.name === kept[s.name]);
            const go = el('button', { type: 'button' }, el('span', { textContent: titled(s) }),
              el('span', { className: 'note', textContent: k >= 0 ? `take ${k + 1} of ${takesOf(s).length}`
                : `draft voice${takesOf(s).length ? `, ${takesOf(s).length} taken` : ''}` }));
            go.dataset.key = `section ${s.name}`;
            go.addEventListener('click', () => pick(s.name));
            return el('li', { className: k >= 0 ? 'kept' : '' }, go);
          }))),
      );
    }
    if (focused) panel.querySelector(`[data-key="${CSS.escape(focused)}"]`)?.focus();
  }

  /** Picks a section to read, or the whole script with none, and goes to where it starts. */
  function pick(name) {
    picked = name || null;
    shown = null;
    seek(startOf());
    render();
  }

  $('section').addEventListener('change', (e) => pick(e.target.value));
  // Opening the takes takes focus to them, on the one kept, since they're drawn above the bar;
  // Escape closes them and gives focus back to the button.
  $('show-takes').addEventListener('click', () => {
    open = !open;
    render();
    if (open) ($('takes').querySelector('input:checked') ?? $('takes').querySelector('button'))?.focus();
  });
  $('takes').addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    open = false;
    render();
    $('show-takes').focus();
  });
  $('start').addEventListener('click', toggle);
  $('restart').addEventListener('click', () => { generation += 1; seek(startOf()); });
  $('playback').addEventListener('click', playBack);
  $('guide').addEventListener('change', () => {
    if (!$('guide').checked) guide.pause();
    else if (!figure.paused) { guide.currentTime = figure.time; guide.play().catch(() => {}); }
  });
  // Space starts and stops when nothing that takes it has focus. On a button, a radio or the
  // section menu it does what it does there; on Start, that's starting and stopping too.
  const takesSpace = (target) => target instanceof Element
    && target.closest('button, input, select, textarea, a[href], summary, [contenteditable], [tabindex], pencil-figure');
  addEventListener('keydown', (e) => {
    if (e.key !== ' ' || takesSpace(e.target)) return;
    e.preventDefault();
    if (!e.repeat) toggle();
  });
  addEventListener('resize', () => { shown = null; show(figure.time); });

  // A narrow window keeps the rest behind ⋯: opened, it sits over its button, its first control
  // takes focus, and closing it gives focus back to the button.
  const options = $('options');
  options.addEventListener('beforetoggle', (e) => {
    if (e.newState !== 'open') {
      if (options.contains(document.activeElement)) $('more').focus();
      return;
    }
    const at = $('more').getBoundingClientRect();
    options.style.bottom = `${innerHeight - at.top + 4}px`;
    options.style.right = `${Math.max(8, innerWidth - at.right)}px`;
  });
  options.addEventListener('toggle', (e) => {
    if (e.newState === 'open') options.querySelector('button:not([hidden]), input')?.focus();
  });

  render();
  loadTakes();
</script>
</body>
</html>
