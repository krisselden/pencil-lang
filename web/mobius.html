<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coxeter and Möbius</title>
<style>
  :root { color-scheme: light dark; --ink: rgb(18 17 15); --paper: rgb(242 240 235); --muted: rgb(110 106 99); --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: rgb(243 240 234); --paper: rgb(23 22 20); --muted: rgb(148 143 134); } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 8rem; }
  output { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <h1>Coxeter’s loxodromic sequence, through a Möbius map</h1>
  <pencil-figure id="figure" src="../corpus/010-mobius/mobius.pen" paused
    aria-label="Circles at the powers of w, each touching its neighbors, and their image under a Möbius map, where they still touch."></pencil-figure>
  <p id="formula" style="color: var(--ink); font: italic 1.0625rem Charter, 'Bitstream Charter', Cambria, serif">f(z) = (az − b) / (cz + d)</p>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <label><i>n</i> <input data-param id="n" type="range" min="1" max="10" step="1" value="8"> <output></output></label>
    <label><i>a</i> <input data-param id="a" type="range" min="-10" max="10" step="0.01" value="1"> <output></output></label>
    <label><i>b</i> <input data-param id="b" type="range" min="-10" max="10" step="0.01" value="1"> <output></output></label>
    <label><i>c</i> <input data-param id="c" type="range" min="-10" max="10" step="0.01" value="0.5"> <output></output></label>
    <label><i>d</i> <input data-param id="d" type="range" min="-10" max="10" step="0.01" value="2"> <output></output></label>
  </div>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report, playButton } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));
  playButton(figure, $('play'));

  // The reader's theme picks the sheets.
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const pick = () => figure.setAttribute('sheets',
    ['../corpus/theme.style', '../corpus/010-mobius/plain.style', ...(dark.matches ? ['../corpus/dark.style'] : [])].join(' '));
  pick();
  dark.addEventListener('change', pick);

  // At t = 3.5 the map is the graph's own, so it starts there, paused.
  figure.time = 3.5;

  // Moving a slider holds its param. Time drives b, c and d, so moving one of those pauses, and
  // playing hands them back.
  const inputs = [...document.querySelectorAll('[data-param]')];
  for (const input of inputs) {
    input.addEventListener('input', () => {
      if (figure.info?.timeDriven.includes(input.id)) figure.pause();
      figure.hold(input.id, Number(input.value));
    });
  }
  figure.addEventListener('draw', () => {
    for (const input of inputs) {
      const value = figure.value(input.id);
      input.value = value;
      input.nextElementSibling.textContent = value.toFixed(input.id === 'n' ? 0 : 2);
    }
  });

  window.pencil = { figure };
</script>
</body>
</html>
