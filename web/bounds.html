<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounds Construction</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 765px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .stage { position: relative; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; outline-offset: 2px; }
  .label { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
           font-family: system-ui, -apple-system, sans-serif; line-height: 1;
           paint-order: stroke; -webkit-text-stroke-color: transparent; will-change: transform; }
  .label.math { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-style: italic; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 7rem; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; align-items: center; }
  legend { float: left; padding: 0 6px 0 0; }
  output, #count { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #caption { color: var(--ink); min-height: 3em; }
  #readout { font-variant-numeric: tabular-nums; }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Bounds: the two boundary flowers, by ruler and compass</h1>
  <div class="stage" id="stage"><canvas id="figure" tabindex="0" aria-label="A ruler-and-compass construction of the two boundary Doyle flowers around the circle at 1, one step at a time. Left and right arrow keys step through it."></canvas></div>
  <div class="controls">
    <button id="back" type="button">Back</button>
    <span id="count"></span>
    <button id="next" type="button">Next</button>
    <label>q <input id="q" type="range" min="4" max="12" step="1" value="6"> <output id="q-value" for="q">6</output></label>
    <fieldset>
      <legend>closes for</legend>
      <label><input type="radio" name="case" value="1" checked> p = 0</label>
      <label><input type="radio" name="case" value="0"> q = 2p</label>
    </fieldset>
    <span>Drag P.</span>
  </div>
  <p id="caption" aria-live="polite"></p>
  <p id="readout"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import init, { Player } from './pkg/pencil_web.js';

  const BASE = '../corpus/004-bounds/';
  const $ = (id) => document.getElementById(id);
  const canvas = $('figure');
  const stage = $('stage');
  const params = new URLSearchParams(location.search);

  const read = async (name) => {
    const response = await fetch(BASE + name, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${name}: ${response.status}`);
    return response.text();
  };

  const firstDoc = await read('bounds.pen');
  const design = {
    width: Number(/width:\s*([\d.]+)/.exec(firstDoc)[1]),
    height: Number(/height:\s*([\d.]+)/.exec(firstDoc)[1]),
  };
  const dpr = window.devicePixelRatio || 1;
  canvas.style.aspectRatio = `${design.width} / ${design.height}`;
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round((canvas.clientWidth * design.height / design.width) * dpr);
  const scale = canvas.width / design.width;

  await init();
  const player = await Player.create(canvas, params.has('gl'));

  // The page's state is its bindings: it never computes the figure's values itself.
  let beats = [];
  let beat = 0;
  let dirty = true;
  const TIME = 0;

  const restore = () => {
    player.set_param('beat', beat);
    player.set_param('q', Number($('q').value));
    player.set_param('ring', Number(document.querySelector('input[name=case]:checked').value));
  };

  let loaded = '';
  let compiles = 0;
  const reload = async () => {
    let doc, style;
    try {
      [doc, style] = await Promise.all([read('bounds.pen'), read('blog.style')]);
    } catch (e) {
      $('error').textContent = String(e);
      return;
    }
    const key = `${doc}\0${style}`;
    if (key === loaded) return;
    loaded = key;
    try {
      player.load(doc, [style]);
      beats = JSON.parse(player.info()).beats;
      restore();
      $('error').textContent = '';
      compiles += 1;
      $('status').textContent = `${player.backend}, ${canvas.width}×${canvas.height}, compiled ${compiles} time${compiles === 1 ? '' : 's'}`;
      go(beat);
    } catch (e) {
      $('error').textContent = `bounds.pen or blog.style: ${e.message}`;
    }
  };

  function go(index) {
    beat = Math.max(0, Math.min(beats.length - 1, index));
    player.set_param('beat', beat);
    $('back').disabled = beat === 0;
    $('next').disabled = beat === beats.length - 1;
    $('count').textContent = `${beat + 1} / ${beats.length}`;
    $('caption').textContent = beats[beat];
    dirty = true;
  }
  $('back').addEventListener('click', () => go(beat - 1));
  $('next').addEventListener('click', () => go(beat + 1));
  canvas.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(beat + 1);
    else if (e.key === 'ArrowLeft') go(beat - 1);
    else return;
    e.preventDefault();
  });

  // The q slider and the case set θ through its binding, so they hand θ back to it.
  const snap = () => {
    player.release_param('theta');
    restore();
    $('q-value').textContent = $('q').value;
    dirty = true;
  };
  $('q').addEventListener('input', snap);
  for (const radio of document.querySelectorAll('input[name=case]')) radio.addEventListener('change', snap);

  const device = (e) => {
    const box = canvas.getBoundingClientRect();
    return [(e.clientX - box.left) * (canvas.width / box.width), (e.clientY - box.top) * (canvas.height / box.height)];
  };
  canvas.addEventListener('pointerdown', (e) => {
    const [x, y] = device(e);
    if (player.grab(TIME, x, y, 24 * dpr)) {
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
      player.drag(TIME, x, y);
      dirty = true;
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!canvas.hasPointerCapture(e.pointerId)) {
      const [x, y] = device(e);
      canvas.style.cursor = player.grab(TIME, x, y, 24 * dpr) ? 'grab' : '';
      player.release();
      return;
    }
    const [x, y] = device(e);
    player.drag(TIME, x, y);
    dirty = true;
  });
  const end = (e) => {
    if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    player.release();
    canvas.style.cursor = '';
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  const spans = new Map();
  const drawLabels = (labels) => {
    const present = new Set();
    for (const label of labels) {
      present.add(label.id);
      let span = spans.get(label.id);
      if (!span) {
        span = document.createElement('span');
        span.className = 'label';
        stage.append(span);
        spans.set(label.id, span);
      }
      if (span.textContent !== label.text) span.textContent = label.text;
      span.hidden = false;
      span.classList.toggle('math', label.math);
      span.style.fontSize = `${label.size / dpr}px`;
      span.style.color = label.color;
      span.style.webkitTextStrokeColor = label.haloColor;
      span.style.webkitTextStrokeWidth = `${label.halo / dpr}px`;
      span.style.opacity = label.opacity;
      span.style.transform = `translate(${label.x / dpr}px, ${label.y / dpr}px) translate(-50%, -50%)`;
    }
    // A label that isn't listed doesn't exist this frame.
    for (const [id, span] of spans) span.hidden = !present.has(id);
  };

  const draw = () => {
    drawLabels(JSON.parse(player.draw(TIME, scale)));
    const v = (name) => player.value(name, TIME);
    const degrees = (r) => `${(r * 180 / Math.PI).toFixed(1)}°`;
    $('readout').textContent =
      `θ ${degrees(v('theta'))}  k ${v('ratio').toFixed(3)}  ring ${v('ring_count').toFixed(2)}  2p: p ${v('zoom_count').toFixed(2)}`;
  };

  // Draws only when something changed, so a still figure costs nothing.
  const frame = () => {
    if (dirty) {
      dirty = false;
      try {
        draw();
      } catch (e) {
        $('error').textContent = e.message;
      }
    }
    requestAnimationFrame(frame);
  };

  await reload();
  setInterval(async () => {
    const before = loaded;
    await reload();
    if (loaded !== before) dirty = true;
  }, 500);
  requestAnimationFrame(frame);

  window.pencil = { player, dpr, scale, draw, go, redraw() { dirty = true; } };
</script>
</body>
</html>
