<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bounds Construction</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 765px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 7rem; }
  fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; align-items: center; }
  legend { float: left; padding: 0 6px 0 0; }
  output, #count { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #caption { color: var(--ink); min-height: 3em; }
  #readout { font-variant-numeric: tabular-nums; }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
  pencil-figure { touch-action: none; }
</style>
</head>
<body>
<main>
  <h1>Bounds: the two boundary flowers, by ruler and compass</h1>
  <pencil-figure id="figure" src="../corpus/004-bounds/bounds.pen" sheets="../corpus/004-bounds/blog.style" paused
    tabindex="0" aria-label="A ruler-and-compass construction of the two boundary Doyle flowers around the circle at 1, one step at a time. Left and right arrow keys step through it."></pencil-figure>
  <div class="controls">
    <button id="back" type="button">Back</button>
    <span id="count"></span>
    <button id="next" type="button">Next</button>
    <span id="params"></span>
    <span>Drag P.</span>
  </div>
  <p id="caption" aria-live="polite"></p>
  <p id="readout"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  // The figure says what its controls are: q's range and step, and the case's options by name.
  // The page only lays them out, so it can't disagree with the playground, which reads the same.
  import './pencil-figure.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  if (new URLSearchParams(location.search).has('gl')) figure.setAttribute('gl', '');

  // q and the case close the flower by setting θ through its binding, so changing one hands θ back
  // from a drag.
  const set = (name, value) => {
    figure.hold(name, value);
    figure.release('theta');
  };

  function controls() {
    const box = $('params');
    box.replaceChildren();
    for (const param of figure.info.params) {
      if (param.choice) {
        // A few options read best side by side.
        const set_ = document.createElement('fieldset');
        const legend = document.createElement('legend');
        legend.textContent = param.choice.of;
        set_.append(legend);
        param.choice.options.forEach((text, i) => {
          const label = document.createElement('label');
          const input = Object.assign(document.createElement('input'), { type: 'radio', name: param.id, value: String(i) });
          input.checked = figure.value(param.id) === i;
          input.addEventListener('change', () => set(param.id, i));
          label.append(input, ` ${text}`);
          set_.append(label);
        });
        box.append(set_);
      } else if (param.id === 'q') {
        const label = document.createElement('label');
        const input = Object.assign(document.createElement('input'), {
          type: 'range', min: param.min, max: param.max, step: param.step ?? 'any', value: figure.value('q'),
        });
        const out = document.createElement('output');
        out.textContent = input.value;
        input.addEventListener('input', () => {
          out.textContent = input.value;
          set('q', Number(input.value));
        });
        label.append('q ', input, ' ', out);
        box.append(label);
      }
    }
  }

  function readout() {
    const beats = figure.info?.beats ?? [];
    const beat = Math.round(figure.beat);
    $('count').textContent = `${beat + 1} / ${beats.length}`;
    $('caption').textContent = beats[beat] ?? '';
    $('back').disabled = beat <= 0;
    $('next').disabled = beat >= beats.length - 1;
    const v = (name) => figure.value(name);
    const degrees = (r) => `${(r * 180 / Math.PI).toFixed(1)}°`;
    // The chosen flower's top centre: P itself when p = 0, and when q = 2p the middle flower's,
    // which lies toward F. Its turns to a full turn is q.
    const turns = v('case.index') < 0.5 ? v('ring_count') : 2 * v('zoom_count');
    const arg = 2 * Math.PI / turns;
    $('readout').textContent =
      `arg z ${degrees(arg)} = 360°/${turns.toFixed(2)}   θ ${degrees(v('theta'))}   k = sin(θ/2) = ${v('ratio').toFixed(3)}`;
  }

  let compiles = 0;
  figure.addEventListener('load', () => {
    compiles += 1;
    $('error').textContent = '';
    $('status').textContent = `${figure.backend ?? 'starting'}, compiled ${compiles} time${compiles === 1 ? '' : 's'}`;
    controls();
    readout();
  });
  figure.addEventListener('draw', readout);
  figure.addEventListener('error', (e) => { $('error').textContent = String(e.detail.error?.message ?? e.detail.error); });
  $('back').addEventListener('click', () => figure.step(-1));
  $('next').addEventListener('click', () => figure.step(1));
  figure.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') figure.step(1);
    else if (e.key === 'ArrowLeft') figure.step(-1);
    else return;
    e.preventDefault();
  });

  // Live reload while editing the figure: recompile when either file changes.
  const read = async (url) => (await fetch(url, { cache: 'no-store' })).text();
  let loaded = null;
  setInterval(async () => {
    try {
      const texts = await Promise.all([read(figure.getAttribute('src')), read(figure.getAttribute('sheets'))]);
      const key = texts.join('\0');
      if (loaded === null) loaded = key;
      else if (key !== loaded) {
        loaded = key;
        figure.load(texts[0], [texts[1]]);
      }
    } catch (e) {
      $('error').textContent = e.message;
    }
  }, 500);

  window.pencil = { figure };
</script>
</body>
</html>
