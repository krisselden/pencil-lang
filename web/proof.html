<!doctype html>
<html lang="en">
<head>
<script src="./imports.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer proof</title>
<style>
  :root { color-scheme: light dark; --ink: rgb(18 17 15); --paper: rgb(242 240 235); --muted: rgb(110 106 99); --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: rgb(243 240 234); --paper: rgb(23 22 20); --muted: rgb(148 143 134); } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 8rem; }
  output { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <h1>Three beats of the first explainer</h1>
  <pencil-figure id="figure" src="../lab/explainer/proof.pen"
    sheets="../corpus/theme.style ../corpus/dark.style ../lab/explainer/proof.style ../lab/explainer/caption.style"
    aria-label="The limaçon from its central circle: 1 reflected across a tangent, the arms that add up to its square, and then the 24 circles through 1 lighting up."></pencil-figure>
  <p>The proof for phase 3 of <code>docs/plan-explainer.md</code>: beats with lengths, ticks, a leader, named terms and a tone that changes. Add <code>?t=2.4</code> to hold one moment.</p>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <input id="time" type="range" min="0" max="10" step="0.01" value="0" aria-label="Time">
    <output id="time-value">0.00</output>
  </div>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report, playButton, timeSlider } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));
  playButton(figure, $('play'));
  timeSlider(figure, $('time'), $('time-value'));
  const held = new URLSearchParams(location.search).get('t');
  if (held !== null) {
    figure.pause();
    figure.time = Number(held);
  }

  window.pencil = { figure };
</script>
</body>
</html>
