<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer proof</title>
<style>
  :root { color-scheme: light dark; --ink: rgb(18 17 15); --paper: rgb(242 240 235); --muted: rgb(110 106 99); --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: rgb(243 240 234); --paper: rgb(23 22 20); --muted: rgb(148 143 134); } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: system-ui, -apple-system, sans-serif; line-height: 1; will-change: transform; }
  .label.math { font-family: Charter, 'Bitstream Charter', 'Sitka Text', Cambria, serif; font-style: italic; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { width: 8rem; }
  output { font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Three beats of the first explainer</h1>
  <div class="stage" id="stage"><canvas id="figure" aria-label="The limaçon from its central circle: 1 reflected across a tangent, the arms that add up to its square, and then the 24 circles through 1 lighting up."></canvas></div>
  <p>The proof for phase 3 of <code>docs/plan-explainer.md</code>: beats with lengths, ticks, a leader, named terms and a tone that changes. Add <code>?t=2.4</code> to hold one moment.</p>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <input id="time" type="range" min="0" max="10" step="0.01" value="0" aria-label="Time">
    <output id="time-value">0.00</output>
  </div>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import init, { Player, figure_size, named_colors } from './pkg/pencil_web.js';
  import { LabelLayer } from './labels.js';
  import { fit, follow } from './fit.js';
  const $ = (id) => document.getElementById(id);
  const get = async (path) => {
    const response = await fetch(path, { cache: 'no-store' });
    if (!response.ok) throw new Error(`${path}: ${response.status}`);
    return response.text();
  };
  const canvas = $('figure');
  const doc = await get('../lab/explainer/proof.pen');
  const sheets = await Promise.all(
    ['../corpus/theme.style', '../corpus/dark.style', '../lab/explainer/proof.style', '../lab/explainer/caption.style'].map(get),
  );
  await init();
  const dpr = window.devicePixelRatio || 1;
  fit(canvas, JSON.parse(figure_size(doc, sheets)));
  const player = await Player.create(canvas, new URLSearchParams(location.search).has('gl'));
  const layer = new LabelLayer($('stage'), dpr);
  player.set_measure(layer.measure);
  const PERIOD = 10;
  const held = new URLSearchParams(location.search).get('t');
  let time = held === null ? 0 : Number(held), last = 0, playing = held === null, dirty = true;
  $('time').addEventListener('input', () => { time = Number($('time').value); playing = false; $('play').textContent = 'Play'; dirty = true; });
  try {
    player.load(doc, sheets);
    $('status').textContent = `${player.backend}, ${canvas.width}×${canvas.height}`;
  } catch (e) {
    $('error').textContent = e.message;
  }
  $('play').addEventListener('click', () => {
    playing = !playing;
    $('play').textContent = playing ? 'Pause' : 'Play';
    dirty = true;
  });
  // Draws now: a resize calls it too, so the cleared canvas is never shown.
  const paint = () => {
    dirty = false;
    $('time').value = time;
    $('time-value').textContent = time.toFixed(2);
    try { layer.update(JSON.parse(player.draw(time, dpr))); } catch (e) { $('error').textContent = e.message; playing = false; }
  };
  const frame = (now) => {
    if (playing) { time = (time + (now - last) / 1000) % PERIOD; dirty = true; }
    last = now;
    if (dirty) paint();
    layer.tick(now);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame((now) => { last = now; frame(now); });
  window.pencil = { player, layer, redraw() { dirty = true; } };
  follow(canvas, player, paint);
</script>
</body>
</html>
