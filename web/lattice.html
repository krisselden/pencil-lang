<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lattice to Spiral</title>
<style>
  /* Its colors come from the figure's sheets, set on the root as it loads. */
  :root { --bad: #b5443c; }
  body { margin: 0; padding: 24px 16px; background: var(--paper_color); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { flex: 1; min-width: 10rem; }
  output { font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; list-style: none; margin: 8px 0; padding: 0; color: var(--muted); font-size: 13px; }
  .legend li::before { content: ''; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; background: var(--c); }
  #readout { color: var(--ink); font: italic 16px Charter, serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>One lattice, through the maps that make a Doyle spiral</h1>
  <pencil-figure id="figure" src="../corpus/007-lattice/lattice.pen"
    aria-label="Four linked panels of a lattice triangle: the lattice itself, after the map to log space, after exp as a spiral of circles, and a close-up of the spiral near 1."></pencil-figure>
  <div class="controls">
    <label><i>q</i> <input id="q" type="range" min="3" max="12" step="1" value="7"></label><output id="q-value" for="q"></output>
    <label><i>p</i> <input id="p" type="range" min="0" max="7" step="1" value="2"></label><output id="p-value" for="p"></output>
  </div>
  <ul class="legend">
    <li style="--c: var(--blue)">(−q)·1</li>
    <li style="--c: var(--green)">(+(q − p))·(1 + ω), to A</li>
    <li style="--c: var(--red)">(+q)·ω</li>
    <li style="--c: var(--accent)">(−p)·(1 + ω), to A</li>
  </ul>
  <p id="readout" aria-live="polite"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));

  // The reader's theme and the page's width pick the sheets. `?dark`, `?light`, `?narrow` and
  // `?wide` pin them, to look at one. The narrow sheet gives the figure another shape, which the
  // element follows, and a new sheet keeps the params and each label where it is.
  const query = new URLSearchParams(location.search);
  const wantsDark = matchMedia('(prefers-color-scheme: dark)');
  const wantsNarrow = matchMedia('(max-width: 600px)');
  const pick = () => {
    const isDark = query.has('dark') || (!query.has('light') && wantsDark.matches);
    const isNarrow = query.has('narrow') || (!query.has('wide') && wantsNarrow.matches);
    document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    figure.setAttribute('sheets', [
      '../corpus/theme.style', '../corpus/007-lattice/plain.style',
      ...(isNarrow ? ['../corpus/007-lattice/narrow.style'] : []),
      ...(isDark ? ['../corpus/dark.style'] : []),
    ].join(' '));
  };
  pick();
  wantsDark.addEventListener('change', pick);
  wantsNarrow.addEventListener('change', pick);

  // The page takes its colors from the figure's sheets.
  figure.addEventListener('load', () => {
    for (const [name, color] of Object.entries(figure.colors)) {
      document.documentElement.style.setProperty(`--${name}`, color);
    }
  });

  for (const name of ['q', 'p']) {
    $(name).addEventListener('input', () => {
      // p steps along the edge of q, so it can't be past it.
      if (Number($('p').value) > Number($('q').value)) {
        $('p').value = $('q').value;
        figure.hold('p', Number($('p').value));
      }
      figure.hold(name, Number($(name).value));
    });
  }

  const signed = (n, sign) => (n === 0 ? '0' : `${sign}${n}`);
  figure.addEventListener('draw', () => {
    const [q, p] = [figure.value('q'), figure.value('p')];
    for (const [name, value] of [['q', q], ['p', p]]) {
      $(name).value = value;
      $(`${name}-value`).textContent = value;
    }
    const route = (text, color) => `<span style="color: var(--${color})">${text}</span>`;
    $('readout').innerHTML = `${route(`(${signed(q, '−')})·1`, 'blue')} + ${route(`(${signed(q - p, '+')})·(1 + ω)`, 'green')} = ${route(`(${signed(q, '+')})·ω`, 'red')} + ${route(`(${signed(p, '−')})·(1 + ω)`, 'accent')} = A = ${p ? `−${p}` : '0'} + ${q - p}ω`;
  });

  window.pencil = { figure };
</script>
</body>
</html>
