<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unroll</title>
<style>
  :root { color-scheme: light dark; --ink: #1c1b19; --paper: #fbfaf7; --muted: #6b675f; --bad: #b5443c; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece9e2; --paper: #1a1917; --muted: #a29d93; --bad: #e58a80; } }
  body { margin: 0; padding: 24px 16px; background: var(--paper); color: var(--ink);
         font: 0.9375rem/1.45 ui-sans-serif, system-ui, sans-serif; }
  main { max-width: 765px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 12px; }
  pencil-figure { cursor: pointer; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 12px 0; }
  .controls input[type=range] { flex: 1; min-width: 140px; }
  output { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  button, select { font: inherit; }
  p { margin: 4px 0; color: var(--muted); }
  #readout { font-variant-numeric: tabular-nums; }
  #error { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <h1>Unroll: unwinding a string from a circle</h1>
  <pencil-figure id="figure" src="../corpus/003-unroll/unroll.pen" sheets="../corpus/003-unroll/blog.style"
    aria-label="A string unwinding from a circle. Its end traces an involute, and the triangle it makes with the center always has the area of the sector swept so far."></pencil-figure>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <label for="a">a</label>
    <input id="a" type="range" step="0.001" value="0">
    <output id="a-value" for="a">0°</output>
    <label>style
      <select id="style">
        <option value="blog.style">blog.style</option>
        <option value="night.style">night.style</option>
      </select>
    </label>
  </div>
  <p id="readout"></p>
  <p id="status">Starting…</p>
  <p id="error" role="alert"></p>
</main>
<script type="module">
  import { fromQuery, report, playButton, watch } from './controls.js';

  const $ = (id) => document.getElementById(id);
  const figure = $('figure');
  fromQuery(figure);
  report(figure, $('status'), $('error'));
  playButton(figure, $('play'));
  // Clicking the figure plays and pauses it too.
  figure.addEventListener('click', () => (figure.paused ? figure.play() : figure.pause()));
  // A reader who'd rather it held still sees it partway through.
  if (figure.paused) figure.time = 5;

  // Moving the slider takes `a` over from time: same param, a different binding. Playing carries
  // on from where the reader left it.
  $('a').addEventListener('input', () => {
    figure.pause();
    figure.hold('a', Number($('a').value));
  });
  figure.addEventListener('load', () => {
    const a = figure.info.params.find((p) => p.id === 'a');
    Object.assign($('a'), { min: a.min, max: a.max });
  });
  figure.addEventListener('draw', () => {
    const v = (name) => figure.value(name);
    const a = v('a');
    $('a').value = a;
    $('a-value').textContent = `${Math.round(a * 180 / Math.PI)}°`;
    const [triangle, wedge] = [v('triangle_area'), v('wedge_area')];
    $('readout').textContent = `triangle ${triangle.toFixed(3)} + wedge ${wedge.toFixed(3)} = ${(triangle + wedge).toFixed(3)}`;
  });

  // A new sheet keeps the time and the held param. Edit either file and the figure reloads.
  $('style').addEventListener('change', () => figure.setAttribute('sheets', `../corpus/003-unroll/${$('style').value}`));
  watch(figure);

  window.pencil = { figure };
</script>
</body>
</html>
